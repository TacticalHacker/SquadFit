# AWS Amplify Hosting build for the Next.js app in a pnpm monorepo.
# Console setup: README "Deploying the web app (Amplify)". Set AMPLIFY_MONOREPO_APP_ROOT=apps/web
# and the env vars API_URL, COGNITO_REGION, COGNITO_CLIENT_ID on the app.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24 && nvm use 24
            - corepack enable
            - cd ../.. && pnpm install --frozen-lockfile && cd apps/web
        build:
          commands:
            # Server-side code reads these at runtime; Amplify only exposes them to the build by default.
            - env | grep -E '^(API_URL|COGNITO_REGION|COGNITO_CLIENT_ID|COGNITO_ENDPOINT)=' >> .env.production
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/.pnpm-store/**/*
          - .next/cache/**/*
